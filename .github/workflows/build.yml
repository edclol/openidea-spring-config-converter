name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build plugin
        run: |
          cargo build --release --target wasm32-wasip2
          mkdir -p dist
          cp target/wasm32-wasip2/release/openidea_plugin_spring_config_converter.wasm dist/plugin.wasm

      - name: Install OpenIDEA plugin CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CLI_VERSION=v0.1.50
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/l0ng-ai/openidea/releases/download/${CLI_VERSION}/openidea-plugin-linux-x86_64.gz" \
            -o /tmp/openidea-plugin.gz
          gzip -df /tmp/openidea-plugin.gz
          chmod +x /tmp/openidea-plugin
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Check and pack
        env:
          SIGNING_KEY: ${{ secrets.OPENIDEA_SIGNING_KEY }}
        run: |
          set -e
          openidea-plugin check .
          VERSION=$(grep -m1 '^version' plugin.toml | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p artifacts
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" > /tmp/edc.key
            chmod 600 /tmp/edc.key
            openidea-plugin pack . --key /tmp/edc.key --publisher edc --out "${{ github.workspace }}/artifacts/edc.spring-config-converter-${VERSION}.oiplugin"
            rm -f /tmp/edc.key
          else
            openidea-plugin pack . --out "${{ github.workspace }}/artifacts/edc.spring-config-converter-${VERSION}.oiplugin"
          fi
          openidea-plugin check "artifacts/edc.spring-config-converter-${VERSION}.oiplugin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oiplugin
          path: artifacts/*.oiplugin

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.oiplugin
          generate_release_notes: true
