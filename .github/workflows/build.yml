name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build plugin
        run: |
          cargo build --release --target wasm32-wasip2
          mkdir -p dist
          cp target/wasm32-wasip2/release/openidea_plugin_spring_config_converter.wasm dist/plugin.wasm

      - name: Install OpenIDEA plugin CLI
        run: |
          set -e
          CLI_VERSION=$(curl -sL https://api.github.com/repos/l0ng-ai/openidea/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -fsSL "https://github.com/l0ng-ai/openidea/releases/download/v${CLI_VERSION}/openidea-plugin-linux-x86_64.gz" -o /tmp/openidea-plugin.gz
          gzip -df /tmp/openidea-plugin.gz
          chmod +x /tmp/openidea-plugin
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Check and pack
        run: |
          set -e
          openidea-plugin check .
          VERSION=$(grep -m1 '^version' plugin.toml | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p artifacts
          openidea-plugin pack . --out "${{ github.workspace }}/artifacts/edc.spring-config-converter-${VERSION}.oiplugin"
          openidea-plugin check "artifacts/edc.spring-config-converter-${VERSION}.oiplugin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oiplugin
          path: artifacts/*.oiplugin

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.oiplugin
          generate_release_notes: true
